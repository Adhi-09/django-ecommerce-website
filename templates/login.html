{% load static %}

<!DOCTYPE html>
<html>

<head>

    <title>Login</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=2">

</head>

<body>

<div class="login-container">

    <div class="login-card">

        <h1>Welcome Back 👋</h1>

        <p class="subtitle">
            Login to continue shopping
        </p>

        <form method="POST">

            {% csrf_token %}

            <input
                type="text"
                name="username"
                placeholder="Username"
                required>

            <input
                type="password"
                name="password"
                placeholder="Password"
                required>

            <button type="submit">

                Login

            </button>

        </form>

        <div class="register-link">

            Don't have an account?

            <a href="/register/">
                Register
            </a>

        </div>

    </div>

</div>

</body>

</html>
