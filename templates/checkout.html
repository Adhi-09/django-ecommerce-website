{% load static %}

<!DOCTYPE html>
<html>

<head>

    <title>Checkout</title>

    <link rel="stylesheet" href="{% static 'css/checkout.css' %}">

</head>

<body>
<body>

    <nav>
        
         <div class="right-nav">

            <a href="/cart/">Back</a>

        </div>
        <div class="left-nav">

            <a href="/">Home</a>

        </div>
        
    </nav>
<div class="checkout-container">

    <div class="checkout-card">

        <h1>Checkout</h1>

       

        <form method="POST">

            {% csrf_token %}

            <label>Delivery Address</label>

            <textarea
                name="address"
                placeholder="Enter your complete address"
                required></textarea>

            <label>Phone Number</label>

            <input
                type="text"
                name="phone"
                placeholder="Enter phone number"
                required>
             <div class="total-section">

            <h2>Total Amount</h2>

            <h3>₹{{ total }}</h3>

        </div>

            <button type="submit">

                Place Order

            </button>

        </form>

    </div>

</div>

</body>

</html>
