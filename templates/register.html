{% load static %}

<!DOCTYPE html>
<html>

<head>

    <title>Register</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">

</head>

<body>

<div class="register-container">

    <div class="register-card">

        <div class="logo">
            🛍️
        </div>

        <h1>Create Account</h1>

        <p class="subtitle">
            Join our Ecommerce Store today
        </p>

        <form method="POST">

            {% csrf_token %}

            <input
                type="text"
                name="username"
                placeholder="Username"
                required>

            <input
                type="email"
                name="email"
                placeholder="Email Address"
                required>

            <input
                type="password"
                name="password"
                placeholder="Password"
                required>

            <button type="submit">

                Create Account

            </button>

        </form>

        {% if error %}

        <p class="error-message">

            {{ error }}

        </p>

        {% endif %}

        <div class="login-link">

            Already have an account?

            <a href="/login/">

                Login

            </a>

        </div>

    </div>

</div>

</body>

</html>
